<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12141b">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Quemarueda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: una sola columna tipo móvil; noche en una recta de polígono bajo farolas de sodio. */
:root{
  --asfalto:#12141b;
  --panel:#1b1e28;
  --panel2:#242835;
  --linea:#343a4c;
  --texto:#ece6d9;
  --tenue:#9297a6;
  --sodio:#ffb23e;
  --sodio-tinta:#2a1c06;
  --verde:#43d681;
  --rojo:#ff5a43;
  --azul:#5fcaff;
  --f-disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--asfalto);color:var(--texto);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--asfalto)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sodio);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 104px;display:flex;flex-direction:column;gap:16px}

/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--asfalto);padding-block:8px}
.marca{font-family:var(--f-disp);font-weight:900;font-size:30px;letter-spacing:.02em;line-height:1;text-transform:uppercase;color:var(--texto)}
.marca span{color:var(--sodio)}
.pasta{font-family:var(--f-mono);font-weight:700;font-size:15px;background:var(--sodio);color:var(--sodio-tinta);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pasta.sube{animation:sube .6s ease}
@keyframes sube{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* garaje */
.box{background:var(--panel);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.foto{display:block;width:100%;height:auto;aspect-ratio:16/8;max-width:100%}
.colores{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--linea);align-items:center}
.colores small{color:var(--tenue);margin-right:auto;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.sw[aria-pressed="true"]{border-color:var(--texto)}

.crono{display:grid;grid-template-columns:1fr auto;align-items:end;gap:6px 12px;padding:14px 16px 12px}
.crono .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.crono .big{font-family:var(--f-disp);font-weight:900;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.crono .big small{font-size:28px;color:var(--tenue);font-weight:800;margin-left:4px}
.crono .dif{font-family:var(--f-mono);font-size:13px;text-align:right}
.datos{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--linea)}
.datos div{padding:10px 8px;text-align:center;border-right:1px solid var(--linea)}
.datos div:last-child{border-right:0}
.datos b{display:block;font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.datos span{font-size:11px;color:var(--tenue);letter-spacing:.06em;text-transform:uppercase}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--tenue)}
.seg button[aria-selected="true"]{background:var(--panel2);color:var(--texto)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--linea);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chip i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--tenue)}
.chip[aria-pressed="true"]{background:var(--texto);color:var(--asfalto);border-color:var(--texto)}
.chip[aria-pressed="true"] i{color:var(--asfalto)}

.opts{display:flex;flex-direction:column}
.opt{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border-top:1px solid var(--linea);align-items:center}
.opt:first-child{border-top:0}
.opt h3{margin:0;font-size:16px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.opt p{margin:0;color:var(--tenue);font-size:13.5px;grid-column:1;min-width:0}
.efecto{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:2px 6px;border-radius:5px}
.efecto.mejor{color:var(--verde);background:color-mix(in srgb,var(--verde) 14%,transparent)}
.efecto.peor{color:var(--rojo);background:color-mix(in srgb,var(--rojo) 14%,transparent)}
.efecto.igual{color:var(--tenue);background:var(--panel2)}
.opt .acc{grid-column:2;grid-row:1/span 2}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.comprar{background:var(--sodio);color:var(--sodio-tinta);font-family:var(--f-mono)}
.btn.comprar:disabled{background:var(--panel2);color:var(--tenue);cursor:not-allowed}
.btn.equipar{background:var(--panel2);color:var(--texto);border:1px solid var(--linea)}
.puesta{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sodio);font-weight:700}

.regla{padding:16px;border-top:1px solid var(--linea);display:flex;flex-direction:column;gap:8px}
.regla:first-child{border-top:0}
.regla header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.regla h3{margin:0;font-size:16px}
.regla header b{font-family:var(--f-mono);font-size:14px;color:var(--sodio)}
.regla p{margin:0;color:var(--tenue);font-size:13.5px;max-width:60ch}
.extremos{display:flex;justify-content:space-between;font-size:12px;color:var(--tenue);letter-spacing:.06em;text-transform:uppercase}
input[type=range]{width:100%;accent-color:var(--sodio);height:28px}
.bloq{padding:16px;color:var(--tenue);font-size:14px;border-top:1px solid var(--linea)}

/* carreras */
.intro{color:var(--tenue);margin:0;font-size:14px;max-width:60ch}
.rival{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;padding:14px 16px;border-top:1px solid var(--linea);align-items:center;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.rival:first-child{border-top:0}
.rival:disabled{opacity:.45;cursor:not-allowed}
.rival .num{font-family:var(--f-disp);font-weight:900;font-size:34px;line-height:1;color:var(--tenue);grid-row:1/span 2;width:34px;text-align:center}
.rival.ok .num{color:var(--verde)}
.rival.next .num{color:var(--sodio)}
.rival h3{margin:0;font-size:16px;min-width:0}
.rival .car{color:var(--tenue);font-size:13px;grid-column:2;min-width:0}
.rival .tiempos{grid-column:3;grid-row:1/span 2;text-align:right;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.tiempos .gana{color:var(--verde)}
.tiempos .pierde{color:var(--rojo)}
.tiempos .premio{color:var(--sodio);font-weight:700}

/* navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--asfalto) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:10px}
.nav button{border:1px solid var(--linea);background:var(--panel);border-radius:12px;padding:12px;font-family:var(--f-disp);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.nav button[aria-selected="true"]{background:var(--sodio);color:var(--sodio-tinta);border-color:var(--sodio)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--texto);color:var(--asfalto);padding:10px 16px;border-radius:10px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s}

/* carrera */
.race{position:fixed;inset:0;z-index:40;background:#0b0d13;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none}
.lienzo{position:relative;flex:1;min-height:0}
.lienzo canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.flotan{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;pointer-events:none}
.flotan button{pointer-events:auto;border:1px solid rgba(255,255,255,.18);background:rgba(10,12,18,.6);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;color:#ece6d9}
.mandos{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));background:#0b0d13}
.mandos button{border:0;border-radius:16px;touch-action:none;font-family:var(--f-disp);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
#bNitro{background:#16324a;color:var(--azul);font-size:22px;position:relative;overflow:hidden;min-height:92px}
#bNitro:disabled{opacity:.35}
#bNitro .carga{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--azul) 35%,transparent);height:0}
#bNitro span{position:relative}
#bGas{background:var(--sodio);color:var(--sodio-tinta);font-size:38px;min-height:92px;line-height:1}
#bGas small{display:block;font-family:var(--f-body);font-weight:600;font-size:13px;letter-spacing:.02em;text-transform:none;margin-top:4px}
#bGas.cambio{background:var(--texto);color:#12141b}
#bGas.pulsado{transform:scale(.98);filter:brightness(1.1)}
#bGas:disabled{opacity:.4}

.resultado{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,9,14,.72);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.tarjeta{background:var(--panel);border:1px solid var(--linea);border-radius:16px;width:100%;max-width:420px;padding:18px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.tarjeta h2{margin:0;font-family:var(--f-disp);font-weight:900;font-size:54px;line-height:.9;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.tarjeta h2.gana{color:var(--verde)}
.tarjeta h2.pierde{color:var(--rojo)}
.tarjeta .sub{margin:-6px 0 0;color:var(--tenue)}
.tabla{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tabla th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);font-weight:600;text-align:right;padding:4px 0}
.tabla th:first-child,.tabla td:first-child{text-align:left}
.tabla td{font-family:var(--f-mono);font-size:14px;text-align:right;padding:6px 0;border-top:1px solid var(--linea)}
.tabla td:first-child{font-family:var(--f-body);font-weight:700}
.premio-big{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:12px;padding:12px 14px}
.premio-big b{font-family:var(--f-mono);font-size:22px;color:var(--sodio)}
.consejo{margin:0;font-size:14px;color:var(--texto);background:color-mix(in srgb,var(--sodio) 10%,transparent);border-left:3px solid var(--sodio);padding:8px 12px;border-radius:4px}
.botones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.botones .ancho{grid-column:1/-1}
.btn.grande{padding:14px;font-size:15px}
.btn.anuncio{background:var(--azul);color:#06202f}
.btn.anuncio:disabled{background:var(--panel2);color:var(--tenue)}
.btn.sec{background:var(--panel2);border:1px solid var(--linea);color:var(--texto)}
.btn.pri{background:var(--sodio);color:var(--sodio-tinta)}
.ad{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:24px}
.ad b{font-family:var(--f-disp);font-size:72px;font-weight:900}
.ad small{color:#999;max-width:30ch}
@media (prefers-reduced-motion:reduce){.pasta.sube{animation:none}}
@media (min-width:600px){.crono .big{font-size:76px}}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div class="marca">Quema<span>rueda</span></div>
    <div class="pasta" id="pasta">0 €</div>
  </header>

  <section id="vGaraje" style="display:flex;flex-direction:column;gap:14px">
    <div class="box">
      <canvas class="foto" id="foto" width="800" height="400" aria-label="Tu coche en el garaje"></canvas>
      <div class="colores" id="colores"><small>Pintura</small></div>
    </div>
    <div class="box">
      <div class="crono">
        <div class="lbl">Cuarto de milla (402 m), bien conducido</div>
        <div></div>
        <div class="big" id="eEt">0,00<small>s</small></div>
        <div class="dif" id="eRival"></div>
      </div>
      <div class="datos">
        <div><b id="eCv">0</b><span>CV</span></div>
        <div><b id="eKg">0</b><span>kg</span></div>
        <div><b id="e100">0</b><span>0–100</span></div>
        <div><b id="eTop">0</b><span>Punta</span></div>
      </div>
    </div>
    <div class="seg" role="tablist">
      <button role="tab" id="tPiezas" aria-selected="true">Piezas</button>
      <button role="tab" id="tReglaje" aria-selected="false">Reglaje</button>
    </div>
    <div id="pPiezas" style="display:flex;flex-direction:column;gap:12px">
      <div class="chips" id="chips"></div>
      <div class="box opts" id="opts"></div>
    </div>
    <div id="pReglaje" class="box" hidden></div>
  </section>

  <section id="vCarreras" hidden style="display:flex;flex-direction:column;gap:14px">
    <p class="intro">Gana a cada rival para desbloquear el siguiente. Si su tiempo es mejor que el tuyo, toca mejorar el coche o conducir fino: salida en la zona verde y cambio cuando se enciendan las luces azules.</p>
    <div class="box" id="lista"></div>
  </section>
</div>

<nav class="nav"><div role="tablist">
  <button role="tab" id="nGaraje" aria-selected="true">Garaje</button>
  <button role="tab" id="nCarreras" aria-selected="false">Carreras</button>
</div></nav>

<div class="toast" id="toast" hidden></div>

<div class="race" id="race" hidden>
  <div class="lienzo" id="lienzo">
    <canvas id="cv"></canvas>
    <div class="flotan">
      <button id="bSalir">✕ Salir</button>
      <button id="bSonido">Sonido: sí</button>
    </div>
    <div class="resultado" id="res" hidden></div>
  </div>
  <div class="mandos">
    <button id="bNitro"><div class="carga" id="nCarga"></div><span>Nitro</span></button>
    <button id="bGas">Gas<small>Mantén para subir vueltas</small></button>
  </div>
</div>

<script>
// SIM-START
const G = 9.81, RHO = 1.2, AREA = 2.0, R = 0.32, EFF = 0.86, DIST = 402.3, IDLE = 900;
const PARTS = {
  motor: { label: 'Motor', icon: 'M', levels: [
    { n: 'De serie', d: 'El motor que traía de fábrica.', hp: 0, red: 6800, w: 0, cost: 0 },
    { n: 'Admisión y escape', d: 'Respira mejor: algo más de fuerza (y suena mucho mejor).', hp: 24, red: 6900, w: 2, cost: 600 },
    { n: 'Levas y centralita', d: 'Sube más de vueltas y empuja fuerte arriba.', hp: 52, red: 7400, w: 2, cost: 1600 },
    { n: 'Pistones forjados', d: 'Aguanta mucho más. Más fuerza, pero pesa un poco.', hp: 92, red: 7900, w: 12, cost: 3800 },
    { n: 'Motor de competición', d: 'Lo bestia. Mucha potencia y estira hasta 8.600 rpm.', hp: 160, red: 8600, w: 28, cost: 9000 },
  ]},
  turbo: { label: 'Turbo', icon: 'T', levels: [
    { n: 'Sin turbo', d: 'Respuesta inmediata, pero sin empujón extra.', boost: 0, lag: 0, w: 0, cost: 0 },
    { n: 'Turbo pequeño', d: 'Poco empujón, pero entra casi al momento.', boost: 0.2, lag: 0.35, w: 8, cost: 1300 },
    { n: 'Turbo mediano', d: 'Buen empujón, aunque tarda un poco en soplar.', boost: 0.42, lag: 0.85, w: 14, cost: 3200 },
    { n: 'Turbo gigante', d: 'Una patada brutal… cuando por fin sopla. Con una caja lenta, sufre en cada cambio.', boost: 0.8, lag: 1.6, w: 22, cost: 7000 },
  ]},
  ruedas: { label: 'Neumáticos', icon: 'N', levels: [
    { n: 'De calle', d: 'Agarran lo justo. Con mucha potencia, patinan.', mu: 0.9, launch: 0.42, roll: 0.013, cost: 0 },
    { n: 'Deportivos', d: 'Más agarre en la salida.', mu: 1.05, launch: 0.48, roll: 0.013, cost: 450 },
    { n: 'Semi-slick', d: 'Se pegan al asfalto. Para coches con mucha potencia.', mu: 1.28, launch: 0.55, roll: 0.014, cost: 1300 },
    { n: 'Slicks de drag', d: 'El máximo agarre posible. Ruedan un pelín peor.', mu: 1.6, launch: 0.62, roll: 0.017, cost: 3000 },
  ]},
  caja: { label: 'Caja de cambios', icon: 'C', levels: [
    { n: 'Manual de serie', d: '5 marchas largas y cambios lentos (0,45 s).', g: [3.4, 2.05, 1.4, 1.05, 0.82], shift: 0.45, cost: 0 },
    { n: 'Manual cerrada', d: '5 marchas más juntas: el motor no se cae tanto al cambiar. 0,32 s.', g: [3.2, 2.15, 1.6, 1.25, 1.0], shift: 0.32, cost: 850 },
    { n: 'Secuencial de 6', d: '6 marchas y cambios en 0,16 s.', g: [3.1, 2.2, 1.7, 1.36, 1.12, 0.95], shift: 0.16, cost: 2600 },
    { n: 'Doble embrague de 7', d: '7 marchas y cambios casi instantáneos (0,06 s).', g: [3.15, 2.35, 1.84, 1.5, 1.26, 1.08, 0.94], shift: 0.06, cost: 6200 },
  ]},
  peso: { label: 'Peso', icon: 'P', levels: [
    { n: 'De serie', d: 'Con todo: asientos, aire acondicionado, radio…', w: 0, cost: 0 },
    { n: 'Sin asientos traseros', d: 'Quitas 45 kg. Nadie se iba a sentar ahí.', w: -45, cost: 300 },
    { n: 'Capó y maletero de carbono', d: 'Quitas 110 kg.', w: -110, cost: 1000 },
    { n: 'Interior vaciado', d: 'Quitas 190 kg. Un asiento, un volante y poco más.', w: -190, cost: 2400 },
    { n: 'Carrocería de carbono', d: 'Quitas 290 kg. El coche pesa como una moto grande.', w: -290, cost: 5400 },
  ]},
  nitro: { label: 'Nitro', icon: 'O', levels: [
    { n: 'Sin nitro', d: 'Nada que pulsar.', nos: 0, dur: 0, w: 0, cost: 0 },
    { n: 'Botella pequeña', d: '+25 % de potencia durante 1,5 s. Una vez por carrera.', nos: 0.25, dur: 1.5, w: 10, cost: 950 },
    { n: 'Botella doble', d: '+40 % de potencia durante 2,5 s.', nos: 0.4, dur: 2.5, w: 16, cost: 2200 },
    { n: 'Kit de competición', d: '+60 % de potencia durante 3,2 s.', nos: 0.6, dur: 3.2, w: 22, cost: 4600 },

/* --- pintar la escena --- */
function pinta() {
  const p = R.p, r = R.r, w = W, h = H;
  const pxm = Math.min(w / 12, h * 0.085);
  const anchor = w * 0.42 + Math.min(w * 0.12, 4.4 * pxm * 0.5);
  const cam = p.x;

  const sD = d => 0.7 + 0.34 * d;

  cx.fillStyle = sky; cx.fillRect(0, 0, w, top);

    const x = b.x - off + rep * ciudad.total; if (x > w || x + b.w < 0) return;
    const bh = b.h * (h / 700) * 0.9;
    cx.fillStyle = '#10121b'; cx.fillRect(x, top - bh, b.w, bh);
    cx.fillStyle = 'rgba(255,190,90,.35)';
    b.win.forEach(v => { if (v[2]) cx.fillRect(x + 4 + v[0] * (b.w - 10), top - bh + 6 + v[1] * (bh - 14), 3, 4); });
  });

  cx.fillStyle = '#2b2e37'; cx.fillRect(0, wallTop, w, wallBot - wallTop);
  cx.fillStyle = '#373a45'; cx.fillRect(0, wallTop, w, 3);

    cx.beginPath(); cx.moveTo(x, base); cx.lineTo(x, base - hh); cx.lineTo(x + pxm * 1.4, base - hh); cx.stroke();
    cx.fillStyle = '#ffcf80'; cx.fillRect(x + pxm * 1.0, base - hh, pxm * 0.6, pxm * 0.18);
    const gl = cx.createRadialGradient(x + pxm * 1.3, base - hh, 1, x + pxm * 1.3, base - hh, pxm * 2.2);

  quad(cam - 60, cam + 80, 0.02, 0.035, 'rgba(236,230,217,.55)');
  quad(cam - 60, cam + 80, 0.965, 0.98, 'rgba(236,230,217,.55)');
  for (let m = Math.floor((cam - 40) / 6) * 6; m < cam + 80; m += 6) quad(m, m + 3, 0.49, 0.51, 'rgba(255,178,62,.75)');
  // salida
  quad(-0.25, 0, 0.02, 0.98, '#ece6d9');
  // carteles de distancia
  [100, 200, 300].forEach(m => {
    const x = sx(m, -0.02); if (x < -80 || x > w + 80) return;
    const s = pxm * sD(-0.02);
    cx.fillStyle = '#ece6d9'; cx.fillRect(x - s * 0.9, yD(-0.13) - s * 1.6, s * 1.8, s * 1.0);
    cx.fillStyle = '#12141b'; cx.font = `900 ${Math.round(s * 0.7)}px "Big Shoulders Display", sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(m + ' m', x, yD(-0.13) - s * 1.1);
  });
  // meta
  const sq = 0.6;
  for (let i = 0; i < 2; i++) for (let k = 0; k < 16; k++) {
    const d0 = 0.02 + k * (0.96 / 16), d1 = d0 + 0.96 / 16;
    quad(DIST + i * sq, DIST + (i + 1) * sq, d0, d1, (i + k) % 2 ? '#ece6d9' : '#12141b');
  }
  const pf = sx(DIST, -0.08), pf2 = sx(DIST, 1.06);
  // sombras / humo carril rival
  const humo = lane => R.humo.forEach(hm => {
    if (hm.lane !== lane) return;
    const d = lane > 0 ? 0.3 : 0.78, s = sD(d);
    const x = sx(hm.x, d), y = yD(d) - (hm.y || 0) * pxm * s - pxm * 0.3 * s;
    cx.fillStyle = `rgba(200,200,205,${hm.a * 0.6})`;
    cx.beginPath(); cx.arc(x, y, hm.s * pxm * s, 0, 7); cx.fill();
  });
  // poste de meta lejano
  cx.fillStyle = '#ece6d9'; cx.fillRect(pf - 3, yD(-0.08) - pxm * 6 * sD(-0.08), 6, pxm * 6 * sD(-0.08));
  // rival
  humo(1);
  const sR = sD(0.3), Lr = 4.4 * pxm * sR, xr = sx(r.x, 0.3);
  if (xr - Lr < w + 20 && xr > -20) drawCar(cx, xr, yD(0.3), Lr, Object.assign({}, R.lookR, { wheel: r.wheel, pitch: R.pitchR, nitro: r.nosT > 0, lights: true }));
  // jugador
  humo(-1);
  const sP = sD(0.78), Lp = 4.4 * pxm * sP;
  drawCar(cx, sx(p.x, 0.78), yD(0.78), Lp, Object.assign({}, R.lookP, { wheel: p.wheel, pitch: R.pitchP, nitro: p.nosT > 0, lights: true }));
  // suelo de abajo
  cx.fillStyle = '#0b0d13'; cx.fillRect(0, yD(1.04), w, h - yD(1.04));
  cx.fillStyle = '#3a3e4b'; cx.fillRect(0, yD(1.0), w, yD(1.04) - yD(1.0));
  // pancarta de meta (encima)
  const by = yD(-0.08) - pxm * 6 * sD(-0.08), by2 = yD(1.06) - pxm * 6 * sD(1.06);
  if (pf2 > -200 && pf < w + 200) {
    cx.fillStyle = '#ece6d9'; cx.fillRect(pf2 - 4, by2, 8, yD(1.06) - by2);
    cx.fillStyle = '#d8322b'; cx.beginPath(); cx.moveTo(pf, by); cx.lineTo(pf2, by2); cx.lineTo(pf2, by2 + pxm * 1.3); cx.lineTo(pf, by + pxm * 1.0); cx.closePath(); cx.fill();
    cx.save(); cx.translate((pf + pf2) / 2, (by + by2) / 2 + pxm * 0.6); cx.rotate(Math.atan2(by2 - by, pf2 - pf));
    cx.fillStyle = '#fff'; cx.font = `900 ${Math.round(pxm * 0.9)}px "Big Shoulders Display", sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('META', 0, 0); cx.restore();
  }
  // indicador del rival fuera de pantalla
  if (xr - Lr > w - 10 || xr < 10) {
    const gap = r.x - p.x, ahead = gap > 0;
    const txt = `${R.riv.s} ${ahead ? '+' : '−'}${fN(Math.abs(gap), 0)} m`;
    cx.font = '700 13px Barlow, sans-serif'; const tw = cx.measureText(txt).width + 18;
    const bx = ahead ? w - tw - 12 : 12, byy = yD(0.3) - pxm * 1.4;
    cx.fillStyle = 'rgba(10,12,18,.8)'; cx.fillRect(bx, byy, tw, 24);
    cx.fillStyle = ahead ? '#ff5a43' : '#43d681'; cx.textAlign = 'left'; cx.textBaseline = 'middle'; cx.fillText(txt, bx + 9, byy + 12);
  }
  hud(w, h);
}
function hud(w, h) {
  const p = R.p, ps = R.ps, r = R.r;
  // barra de progreso
  const bx = 110, bw = w - 250, byy = 26;
  if (bw > 60) {
    cx.fillStyle = 'rgba(255,255,255,.12)'; cx.fillRect(bx, byy, bw, 4);
    cx.fillStyle = R.riv.col; cx.beginPath(); cx.arc(bx + bw * Math.min(1, r.x / DIST), byy + 2, 6, 0, 7); cx.fill();
    cx.strokeStyle = '#0b0d13'; cx.lineWidth = 2; cx.stroke();
    cx.fillStyle = '#ffb23e'; cx.beginPath(); cx.arc(bx + bw * Math.min(1, p.x / DIST), byy + 2, 7, 0, 7); cx.fill(); cx.stroke();
  }
  // semáforo
  if (R.fase === 'pre' || R.t < VERDE_T + 1.2) {
    const t = R.t, lx = Math.max(40, w * 0.1), ly = 56;
    cx.fillStyle = 'rgba(8,9,14,.85)'; cx.fillRect(lx - 26, ly, 52, 150);
    for (let k = 0; k < 4; k++) {
      const on = k < 3 ? (t >= 1.0 + k * 0.5 && t < VERDE_T) : t >= VERDE_T;
      const col = k < 3 ? '#ffb23e' : '#43d681';
      cx.fillStyle = on ? col : 'rgba(255,255,255,.08)';
      if (on) { cx.shadowColor = col; cx.shadowBlur = 18; }
      cx.beginPath(); cx.arc(lx, ly + 22 + k * 35, 13, 0, 7); cx.fill(); cx.shadowBlur = 0;
    }
  }
  // cuentavueltas
  const rad = Math.min(w * 0.2, h * 0.22, 120);
  const tx = w / 2, ty = h - rad * 0.75 - 10;
  const a0 = Math.PI * 0.8, a1 = Math.PI * 2.2;
  const maxR = Math.ceil(ps.red / 1000) * 1000 + 1000;
  const ang = v => a0 + (a1 - a0) * Math.min(1, v / maxR);
  cx.fillStyle = 'rgba(8,9,14,.88)'; cx.beginPath(); cx.arc(tx, ty, rad + 10, 0, 7); cx.fill();
  cx.lineWidth = rad * 0.08;
  cx.strokeStyle = 'rgba(255,255,255,.1)'; cx.beginPath(); cx.arc(tx, ty, rad * 0.86, a0, a1); cx.stroke();
  cx.strokeStyle = '#ff5a43'; cx.beginPath(); cx.arc(tx, ty, rad * 0.86, ang(ps.red * 0.92), ang(maxR)); cx.stroke();
  if (R.fase === 'pre') {
    const c = ps.launch * ps.red, wd = 0.11 * ps.red;
    cx.strokeStyle = '#43d681'; cx.lineWidth = rad * 0.16; cx.beginPath(); cx.arc(tx, ty, rad * 0.86, ang(c - wd), ang(c + wd)); cx.stroke();
    cx.strokeStyle = '#a6f2c6'; cx.lineWidth = rad * 0.16; cx.beginPath(); cx.arc(tx, ty, rad * 0.86, ang(c - wd * 0.45), ang(c + wd * 0.45)); cx.stroke();
  }
  cx.fillStyle = 'rgba(236,230,217,.7)'; cx.font = `600 ${Math.round(rad * 0.13)}px "JetBrains Mono", monospace`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (let k = 0; k <= maxR / 1000; k++) { const a = ang(k * 1000); cx.fillText(k, tx + Math.cos(a) * rad * 0.64, ty + Math.sin(a) * rad * 0.64); }
  const an = ang(p.rpm);
  cx.strokeStyle = '#ffb23e'; cx.lineWidth = Math.max(2, rad * 0.035); cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(tx, ty); cx.lineTo(tx + Math.cos(an) * rad * 0.9, ty + Math.sin(an) * rad * 0.9); cx.stroke(); cx.lineCap = 'butt';
  cx.fillStyle = '#ffb23e'; cx.beginPath(); cx.arc(tx, ty, rad * 0.07, 0, 7); cx.fill();
  cx.fillStyle = '#ece6d9'; cx.font = `900 ${Math.round(rad * 0.42)}px "Big Shoulders Display", sans-serif`;
  cx.fillText(R.fase === 'pre' ? 'N' : (p.shiftT > 0 ? '·' : p.gear + 1), tx, ty + rad * 0.32);
  cx.font = `700 ${Math.round(rad * 0.15)}px "JetBrains Mono", monospace`; cx.fillStyle = 'rgba(236,230,217,.8)';
  cx.fillText(Math.round(p.v * 3.6) + ' km/h', tx, ty + rad * 0.62);
  // luces de cambio
  const leds = 10, lw = Math.min(16, rad * 0.14), gapL = lw * 0.5, totalW = leds * lw + (leds - 1) * gapL;
  const ly = ty - rad - 22;
  const perfect = R.fase === 'run' && !p.finished && p.shiftT <= 0 && ventanaCambio(p, ps);
  const frac = p.rpm / ps.red;
  for (let k = 0; k < leds; k++) {
    const th = 0.62 + k * 0.035, on = frac >= th;
    let col = k < 4 ? '#43d681' : k < 7 ? '#ffb23e' : '#ff5a43';
    if (perfect) col = (Math.floor(R.t * 14) % 2) ? '#5fcaff' : '#bfe9ff';
    cx.fillStyle = (on || perfect) ? col : 'rgba(255,255,255,.08)';
    cx.beginPath(); cx.arc(tx - totalW / 2 + k * (lw + gapL) + lw / 2, ly, lw / 2, 0, 7); cx.fill();
  }
  // crono
  cx.textAlign = 'right'; cx.fillStyle = '#ece6d9'; cx.font = '700 15px "JetBrains Mono", monospace';
  const tt = R.fase === 'pre' ? 0 : (p.finished ? p.finishT : p.t);
  cx.fillText(fN(tt, 2) + ' s', w - 14, 56);
  cx.fillStyle = 'rgba(236,230,217,.6)'; cx.font = '600 12px Barlow, sans-serif';
  cx.fillText(fN(Math.min(DIST, p.x), 0) + ' / 402 m', w - 14, 76);
  if (R.ps.boost) { cx.fillText('Turbo ' + Math.round(p.spool * 100) + ' %', w - 14, 94); }
  // pista pre-salida
  if (R.fase === 'pre') {
    cx.textAlign = 'center'; cx.fillStyle = '#ece6d9'; cx.font = '700 15px Barlow, sans-serif';
    cx.fillText('Deja la aguja en la zona verde cuando salga el verde', w / 2, ty - rad - 48);
  }
  // mensaje
  if (R.msg && R.msg.t < 1.3) {
    const m = R.msg, a = Math.min(1, (1.3 - m.t) * 3), sc = 1 + Math.max(0, 0.25 - m.t) * 1.2;
    cx.save(); cx.globalAlpha = a; cx.translate(w / 2, h * 0.2 + 40); cx.scale(sc, sc);
    cx.font = `900 ${Math.round(Math.min(46, w * 0.09))}px "Big Shoulders Display", sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    const mw = cx.measureText(m.txt.toUpperCase()).width; if (mw > w - 40) cx.scale((w - 40) / mw, (w - 40) / mw);
    cx.lineWidth = 6; cx.strokeStyle = 'rgba(8,9,14,.9)'; cx.strokeText(m.txt.toUpperCase(), 0, 0);
    cx.fillStyle = m.col; cx.fillText(m.txt.toUpperCase(), 0, 0); cx.restore();
  }
  // carga de nitro
  if (R.ps.nos) $('nCarga').style.height = (R.p.nosUsed ? (R.p.nosT / R.ps.nosDur) * 100 : 100) + '%';
}

/* --- resultado --- */
function acabar() {
  audioSet(R.p.rpm * 0.5, 0);
  const p = R.p, r = R.r, i = R.i, riv = R.riv;
  const gana = p.finished && (!r.finished || p.finishT < r.finishT);
  const primera = gana && !S.beaten.includes(i);
  let premio;
  if (gana) premio = primera ? riv.premio : Math.round(riv.premio * 0.4 / 10) * 10;
  else premio = Math.max(50, Math.round(riv.premio * 0.1 / 10) * 10);
  S.money += premio;
  if (primera) S.beaten.push(i);
  if (p.finished && (!S.best || p.finishT < S.best)) S.best = p.finishT;
  guardar(); pintarPasta(true);
  const margen = r.finished ? Math.abs(p.finishT - r.finishT) : 0;
  // consejo según lo que pasó
  let tip = '';
  const miEst = R.ps && simulate(R.ps).et;
  if (R.q === 'spin') tip = 'Saliste con demasiadas vueltas y las ruedas patinaron. Suelta un poco el gas antes del verde, o monta neumáticos con más agarre.';
  else if (R.q === 'bog') tip = 'Saliste con pocas vueltas y el motor se ahogó. Mantén el gas para que la aguja llegue a la zona verde.';
  else if (R.cortes > 0) tip = 'Llegaste al corte de vueltas. Cambia cuando las luces se pongan azules.';
  else if (R.cambios.early > 0) tip = 'Cambiaste demasiado pronto. Espera a las luces azules.';
  else if (!gana && miEst > riv.est.et) tip = `Aunque conduzcas perfecto, tu coche hace ${fT(miEst)} y el de ${riv.n} ${fT(riv.est.et)}. Toca mejorar piezas.`;
  else if (!gana) tip = 'Tu coche puede ganarle. Afina la salida y los cambios.';
  else if (primera && i < RIVALES.length - 1) tip = `Desbloqueado: ${RIVALES[i + 1].n}.`;
  else if (primera) tip = 'Has ganado al Jefe del Polígono. Eres el rey de la recta.';
  const fila = (n, c) => `<tr><td>${n}</td><td>${c.finished ? fT(c.finishT) : '—'}</td><td>${c.t100 ? fN(c.t100, 2) + ' s' : '—'}</td><td>${c.trap ? Math.round(c.trap * 3.6) : '—'}</td></tr>`;
  const res = $('res');
  res.innerHTML = `<div class="tarjeta" role="dialog" aria-label="Resultado">
    <h2 class="${gana ? 'gana' : 'pierde'}">${gana ? '¡Ganas!' : 'Pierdes'}</h2>
    <p class="sub">${r.finished ? `Por ${fN(margen, 3)} s contra ${riv.n}` : `${riv.n} ni ha llegado`}</p>
    <table class="tabla"><thead><tr><th></th><th>402 m</th><th>0–100</th><th>km/h</th></tr></thead><tbody>${fila('Tú', p)}${fila(riv.s, r)}</tbody></table>
    <div class="premio-big"><span>${gana ? (primera ? 'Premio' : 'Premio (revancha)') : 'Por participar'}</span><b id="rPremio">+${fE(premio)}</b></div>
    ${tip ? `<p class="consejo">${tip}</p>` : ''}
    <div class="botones">
      <button class="btn grande anuncio ancho" id="rAd">Ver anuncio: ×2 premio</button>
      <button class="btn grande sec" id="rOtra">Repetir</button>
      <button class="btn grande pri" id="rGar">Al garaje</button>
    </div></div>`;
  res.hidden = false;
  $('rOtra').onclick = () => { audioOff(); empezar(i); };
  $('rGar').onclick = () => { salir(); vista('g'); subvista('piezas'); };
  $('rAd').onclick = () => {
    const ad = document.createElement('div'); ad.className = 'ad';
    ad.innerHTML = '<span>Anuncio</span><b>3</b><small>Aquí irá el anuncio de verdad cuando el juego esté en la App Store.</small>';
    res.appendChild(ad); let n = 3;
    const t = setInterval(() => { n--; if (n > 0) ad.querySelector('b').textContent = n; else { clearInterval(t); ad.remove(); S.money += premio; guardar(); pintarPasta(true); $('rPremio').textContent = '+' + fE(premio * 2); const b = $('rAd'); b.disabled = true; b.textContent = 'Premio duplicado'; } }, 1000);
  };
}

/* ---------- arranque ---------- */
refrescar();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(dibujaFoto);
})();
</script>
