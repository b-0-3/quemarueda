<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12141b">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Quemarueda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: una columna tipo móvil; noche en una recta de polígono bajo farolas de sodio, con paneles de instrumentación. */
:root{
  --asfalto:#12141b;
  --panel:#1b1e28;
  --panel2:#242835;
  --linea:#343a4c;
  --texto:#ece6d9;
  --tenue:#9297a6;
  --sodio:#ffb23e;
  --sodio-tinta:#2a1c06;
  --verde:#43d681;
  --rojo:#ff5a43;
  --azul:#5fcaff;
  --f-disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--asfalto);color:var(--texto);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--asfalto)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sodio);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 104px;display:flex;flex-direction:column;gap:16px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--asfalto);padding-block:8px}
.marca{font-family:var(--f-disp);font-weight:900;font-size:30px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.marca span{color:var(--sodio)}
.pasta{font-family:var(--f-mono);font-weight:700;font-size:15px;background:var(--sodio);color:var(--sodio-tinta);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pasta.sube{animation:sube .6s ease}
@keyframes sube{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

.box{background:var(--panel);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.foto{display:block;width:100%;height:auto;aspect-ratio:16/7;max-width:100%}
.colores{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--linea);align-items:center}
.colores small{color:var(--tenue);margin-right:auto;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.sw[aria-pressed="true"]{border-color:var(--texto)}

.crono{display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 12px;padding:14px 16px 12px}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.crono .big{font-family:var(--f-disp);font-weight:900;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.crono .big small{font-size:28px;color:var(--tenue);font-weight:800;margin-left:4px}
.crono .dif{font-family:var(--f-mono);font-size:13px;text-align:right}
.parciales{grid-column:1/-1;display:flex;gap:6px 14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12.5px;color:var(--tenue);margin-top:6px}
.parciales b{color:var(--texto);font-weight:700}
.datos{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--linea)}
.datos div{padding:10px 6px;text-align:center;border-right:1px solid var(--linea);min-width:0}
.datos div:last-child{border-right:0}
.datos b{display:block;font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.datos span{font-size:11px;color:var(--tenue);letter-spacing:.06em;text-transform:uppercase}
.aviso{border-top:1px solid var(--linea);padding:10px 16px;font-size:13.5px;color:var(--rojo)}
.aviso b{font-family:var(--f-mono)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--tenue)}
.seg button[aria-selected="true"]{background:var(--panel2);color:var(--texto)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--linea);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chip i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--tenue)}
.chip[aria-pressed="true"]{background:var(--texto);color:var(--asfalto);border-color:var(--texto)}
.chip[aria-pressed="true"] i{color:var(--asfalto)}

.opt{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border-top:1px solid var(--linea);align-items:center}
.opt:first-child{border-top:0}
.opt h3{margin:0;font-size:16px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.opt p{margin:0;color:var(--tenue);font-size:13.5px;grid-column:1;min-width:0}
.opt .spec{font-family:var(--f-mono);font-size:12px;color:var(--texto);opacity:.75;grid-column:1;min-width:0}
.efecto{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:2px 6px;border-radius:5px}
.efecto.mejor{color:var(--verde);background:color-mix(in srgb,var(--verde) 14%,transparent)}
.efecto.peor{color:var(--rojo);background:color-mix(in srgb,var(--rojo) 14%,transparent)}
.efecto.igual{color:var(--tenue);background:var(--panel2)}
.opt .acc{grid-column:2;grid-row:1/span 3}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.comprar{background:var(--sodio);color:var(--sodio-tinta);font-family:var(--f-mono)}
.btn.comprar:disabled{background:var(--panel2);color:var(--tenue);cursor:not-allowed}
.btn.equipar{background:var(--panel2);color:var(--texto);border:1px solid var(--linea)}
.puesta{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sodio);font-weight:700}

.regla{padding:14px 16px;border-top:1px solid var(--linea);display:flex;flex-direction:column;gap:6px}
.regla header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.regla h3{margin:0;font-size:15px}
.regla header b{font-family:var(--f-mono);font-size:14px;color:var(--sodio);white-space:nowrap}
.regla p{margin:0;color:var(--tenue);font-size:13px;max-width:60ch}
.extremos{display:flex;justify-content:space-between;font-size:11px;color:var(--tenue);letter-spacing:.06em;text-transform:uppercase}
input[type=range]{width:100%;accent-color:var(--sodio);height:28px;margin:0;min-width:0}
.bloq{padding:12px 16px;color:var(--tenue);font-size:13px;border-top:1px solid var(--linea)}
.grupo{padding:10px 16px 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sodio);font-weight:700;background:var(--panel2);border-top:1px solid var(--linea)}
.grupo:first-child{border-top:0}
.marchas{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
.marchas span{font-family:var(--f-mono);font-size:12.5px}
.marchas span:first-child{color:var(--tenue)}
.detona{height:8px;border-radius:4px;background:var(--panel2);position:relative;overflow:hidden}
.detona i{position:absolute;inset:0 auto 0 0;border-radius:4px}

.dyno{display:block;width:100%;height:auto;aspect-ratio:16/10;max-width:100%}
.leyenda{display:flex;gap:6px 16px;padding:0 16px 12px;font-size:12.5px;color:var(--tenue);flex-wrap:wrap}
.leyenda b{font-family:var(--f-mono);color:var(--texto)}
.leyenda i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.tabwrap{overflow-x:auto}
.ficha{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.ficha th,.ficha td{padding:8px 10px;border-top:1px solid var(--linea);text-align:left}
.ficha td{white-space:nowrap}
.ficha th:first-child,.ficha td:first-child{padding-left:16px}
.ficha th:last-child,.ficha td:last-child{padding-right:16px}
.ficha th{color:var(--tenue);font-weight:500}
.ficha td{font-family:var(--f-mono);text-align:right}
.ficha thead th{white-space:nowrap;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-top:0;text-align:right;color:var(--sodio);font-weight:700}
.ficha thead th:first-child{text-align:left}

.intro{color:var(--tenue);margin:0;font-size:14px;max-width:60ch}
.rival{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;padding:14px 16px;border-top:1px solid var(--linea);align-items:center;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.rival:first-child{border-top:0}
.rival:disabled{opacity:.45;cursor:not-allowed}
.rival .num{font-family:var(--f-disp);font-weight:900;font-size:34px;line-height:1;color:var(--tenue);grid-row:1/span 3;width:34px;text-align:center}
.rival.ok .num{color:var(--verde)}
.rival.next .num{color:var(--sodio)}
.rival h3{margin:0;font-size:16px;min-width:0}
.rival .car{color:var(--tenue);font-size:13px;grid-column:2;min-width:0}
.rival .esp{font-family:var(--f-mono);font-size:12px;grid-column:2;opacity:.8}
.rival .tiempos{grid-column:3;grid-row:1/span 3;text-align:right;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.tiempos .gana{color:var(--verde)}
.tiempos .pierde{color:var(--rojo)}
.tiempos .premio{color:var(--sodio);font-weight:700}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--asfalto) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:10px}
.nav button{border:1px solid var(--linea);background:var(--panel);border-radius:12px;padding:12px;font-family:var(--f-disp);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.nav button[aria-selected="true"]{background:var(--sodio);color:var(--sodio-tinta);border-color:var(--sodio)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--texto);color:var(--asfalto);padding:10px 16px;border-radius:10px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s}

/* carrera */
.race{position:fixed;inset:0;z-index:40;background:#0b0d13;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.lienzo{position:relative;flex:1;min-height:0}
.lienzo>canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.flotan{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.flotan button{pointer-events:auto;border:1px solid rgba(255,255,255,.18);background:rgba(10,12,18,.6);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;color:#ece6d9}
.mandos{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));background:#0b0d13}
.mandos button{border:0;border-radius:16px;touch-action:none;font-family:var(--f-disp);font-weight:900;text-transform:uppercase;letter-spacing:.04em;min-height:96px;line-height:1;position:relative;overflow:hidden}
.mandos button small{display:block;font-family:var(--f-body);font-weight:600;font-size:12.5px;letter-spacing:.01em;text-transform:none;margin-top:5px;opacity:.85}
#bL{background:#2b303d;color:#ece6d9;font-size:24px}
#bL.nitro{background:#16324a;color:var(--azul)}
#bL:disabled{opacity:.35}
#bL .carga{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--azul) 35%,transparent);height:0}
#bL span{position:relative}
#bR{background:var(--sodio);color:var(--sodio-tinta);font-size:36px}
#bR.cambio{background:var(--texto);color:#12141b}
.mandos button.pulsado{filter:brightness(1.18);transform:scale(.985)}
#bR:disabled{opacity:.4}

.resultado{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;background:rgba(8,9,14,.8);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 16px;overflow:auto;z-index:3}
.tarjeta{background:var(--panel);border:1px solid var(--linea);border-radius:16px;width:100%;max-width:440px;padding:18px;display:flex;flex-direction:column;gap:14px}
.tarjeta h2{margin:0;font-family:var(--f-disp);font-weight:900;font-size:52px;line-height:.9;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.tarjeta h2.gana{color:var(--verde)}
.tarjeta h2.pierde{color:var(--rojo)}
.tarjeta .sub{margin:-6px 0 0;color:var(--tenue)}
.ticket{background:#efe9dc;color:#1b1c22;border-radius:6px;padding:12px 14px;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.ticket header{display:flex;justify-content:space-between;font-weight:700;border-bottom:1px dashed #8a8475;padding-bottom:6px;margin-bottom:4px;letter-spacing:.04em;gap:8px}
.ticket table{width:100%;border-collapse:collapse}
.ticket th{text-align:right;font-weight:700;padding:3px 0}
.ticket th:first-child,.ticket td:first-child{text-align:left;font-weight:500}
.ticket td{text-align:right;padding:3px 0}
.ticket td.w{font-weight:700;text-decoration:underline}
.ticket .pie{border-top:1px dashed #8a8475;margin-top:4px;padding-top:6px;display:flex;justify-content:space-between;gap:8px}
.tele{display:block;width:100%;height:auto;aspect-ratio:2/1;max-width:100%;background:var(--panel2);border-radius:10px}
.premio-big{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:12px;padding:12px 14px}
.premio-big b{font-family:var(--f-mono);font-size:22px;color:var(--sodio)}
.consejo{margin:0;font-size:14px;background:color-mix(in srgb,var(--sodio) 10%,transparent);border-left:3px solid var(--sodio);padding:8px 12px;border-radius:4px}
.botones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.botones .ancho{grid-column:1/-1}
.btn.grande{padding:14px;font-size:15px}
.btn.anuncio{background:var(--azul);color:#06202f}
.btn.anuncio:disabled{background:var(--panel2);color:var(--tenue)}
.btn.sec{background:var(--panel2);border:1px solid var(--linea);color:var(--texto)}
.btn.pri{background:var(--sodio);color:var(--sodio-tinta)}
.ad{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:24px}
.ad b{font-family:var(--f-disp);font-size:72px;font-weight:900}
.ad small{color:#999;max-width:30ch}
@media (prefers-reduced-motion:reduce){.pasta.sube{animation:none}}
@media (min-width:600px){.crono .big{font-size:76px}}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div class="marca">Quema<span>rueda</span></div>
    <div class="pasta" id="pasta">0 €</div>
  </header>

  <section id="vGaraje" style="display:flex;flex-direction:column;gap:14px">
    <div class="box">
      <canvas class="foto" id="foto" width="800" height="350" aria-label="Tu coche en el garaje"></canvas>
      <div class="colores" id="colores"><small>Pintura</small></div>
    </div>
    <div class="box">
      <div class="crono">
        <div class="lbl">1/4 milla estimado · conducción óptima</div>
        <div></div>
        <div class="big" id="eEt">0,00<small>s</small></div>
        <div class="dif" id="eRival"></div>
        <div class="parciales" id="eParc"></div>
      </div>
      <div class="datos">
        <div><b id="eCv">0</b><span>CV</span></div>
        <div><b id="eNm">0</b><span>Nm</span></div>
        <div><b id="eKg">0</b><span>kg</span></div>
        <div><b id="eRel">0</b><span>kg/CV</span></div>
      </div>
      <div class="aviso" id="eKnock" hidden></div>
    </div>
    <div class="seg" role="tablist">
      <button role="tab" id="tPiezas" aria-selected="true">Piezas</button>
      <button role="tab" id="tReglaje" aria-selected="false">Reglaje</button>
      <button role="tab" id="tBanco" aria-selected="false">Banco</button>
    </div>
    <div id="pPiezas" style="display:flex;flex-direction:column;gap:12px">
      <div class="chips" id="chips"></div>
      <div class="box" id="opts"></div>
    </div>
    <div id="pReglaje" class="box" hidden></div>
    <div id="pBanco" style="display:flex;flex-direction:column;gap:12px" hidden>
      <div class="box">
        <canvas class="dyno" id="dyno" width="800" height="500" aria-label="Curvas de potencia y par"></canvas>
        <div class="leyenda" id="dynoLey"></div>
      </div>
      <div class="box tabwrap"><table class="ficha" id="tMarchas"></table></div>
      <div class="box tabwrap"><table class="ficha" id="tFicha"></table></div>
    </div>
  </section>

  <section id="vCarreras" hidden style="display:flex;flex-direction:column;gap:14px">
    <p class="intro">Liga nocturna del polígono, a 1/4 de milla. Gana la ronda para pasar a la siguiente. Cuenta el tiempo total: reacción más recorrido. Si sueltas el embrague antes del verde, es luz roja y pierdes.</p>
    <div class="box" id="lista"></div>
  </section>
</div>

<nav class="nav"><div role="tablist">
  <button role="tab" id="nGaraje" aria-selected="true">Garaje</button>
  <button role="tab" id="nCarreras" aria-selected="false">Carreras</button>
</div></nav>

<div class="toast" id="toast" hidden></div>

<div class="race" id="race" hidden>
  <div class="lienzo" id="lienzo">
    <canvas id="cv"></canvas>
    <div class="flotan">
      <button id="bSalir">✕ Salir</button>
      <button id="bSonido">Sonido</button>
    </div>
    <div class="resultado" id="res" hidden></div>
  </div>
  <div class="mandos">
    <button id="bL"><div class="carga" id="nCarga"></div><span id="bLtxt">Embrague</span></button>
    <button id="bR">Gas</button>
  </div>
</div>

<script>
// SIM-START
const G = 9.81, RHO = 1.2, AREA = 2.0, R = 0.32, EFF = 0.86, IDLE = 900, BASE_HP = 140;
const SPLITS = [
  { d: 18.288, n: '60 ft' }, { d: 100.584, n: '330 ft' }, { d: 201.168, n: '1/8 milla', spd: true },
  { d: 304.8, n: '1000 ft' }, { d: 402.336, n: '1/4 milla', spd: true },
];
const DIST = 402.336;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const PARTS = {

}
let S = nuevo();
function cargar(raw) {
  const d = JSON.parse(raw);

  SLOTS.forEach(s => { if (!S.owned[s]) S.owned[s] = [0]; if (S.eq[s] == null) S.eq[s] = 0; });
  S.tune = Object.assign(tuneDef(), d.tune || {});
  if (!Array.isArray(S.tune.ratios)) S.tune.ratios = [];
  if (S.tune.bar == null && PARTS.turbo.levels[S.eq.turbo].bar) S.tune.bar = PARTS.turbo.levels[S.eq.turbo].bar;

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);

const cache = new Map();
function est(eq, tune) {

const yo = () => est(S.eq, S.tune);

/* ---------- dibujo del coche ---------- */
const BODY = [[0.02, 0.10], [0.97, 0.10], [1.0, 0.16], [0.995, 0.235], [0.80, 0.285], [0.665, 0.305], [0.535, 0.445], [0.30, 0.455], [0.165, 0.33], [0.035, 0.31], [0.0, 0.215], [0.005, 0.12]];

  r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a);

}

    g.addColorStop(0, 'rgba(255,240,200,.28)'); g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(L, -0.21 * L); ctx.lineTo(L * 1.9, -0.32 * L); ctx.lineTo(L * 1.9, 0.02 * L); ctx.closePath(); ctx.fill();

  }
  ctx.fillStyle = '#07080b';
  [0.2, 0.8].forEach(u => { ctx.beginPath(); ctx.arc(u * L, -0.085 * L, 0.098 * L, Math.PI, 0); ctx.fill(); });
  const bg = ctx.createLinearGradient(0, -0.46 * L, 0, -0.1 * L);
  bg.addColorStop(0, shade(o.color, 0.28)); bg.addColorStop(0.45, o.color); bg.addColorStop(1, shade(o.color, -0.45));
  ctx.fillStyle = bg; ctx.beginPath();

  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(1, L * 0.006); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = Math.max(1, L * 0.008);
  ctx.beginPath(); ctx.moveTo(...P(0.05, 0.285)); ctx.lineTo(...P(0.16, 0.30)); ctx.moveTo(...P(0.68, 0.285)); ctx.lineTo(...P(0.94, 0.235)); ctx.stroke();

    ctx.fillStyle = o.stripe; ctx.beginPath();

  }
  ctx.fillStyle = '#0d111b';
  ctx.beginPath(); ctx.moveTo(...P(0.64, 0.305)); ctx.lineTo(...P(0.525, 0.43)); ctx.lineTo(...P(0.43, 0.435)); ctx.lineTo(...P(0.43, 0.31)); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(...P(0.41, 0.31)); ctx.lineTo(...P(0.41, 0.437)); ctx.lineTo(...P(0.31, 0.44)); ctx.lineTo(...P(0.19, 0.325)); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.beginPath(); ctx.moveTo(...P(0.6, 0.31)); ctx.lineTo(...P(0.53, 0.41)); ctx.lineTo(...P(0.5, 0.41)); ctx.lineTo(...P(0.56, 0.31)); ctx.closePath(); ctx.fill();
  if (o.cage) { ctx.strokeStyle = 'rgba(200,205,215,.55)'; ctx.lineWidth = Math.max(1, L * 0.006); ctx.beginPath(); ctx.moveTo(...P(0.33, 0.43)); ctx.lineTo(...P(0.25, 0.32)); ctx.moveTo(...P(0.33, 0.43)); ctx.lineTo(...P(0.42, 0.32)); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(1, L * 0.005);
  ctx.beginPath(); ctx.moveTo(...P(0.42, 0.305)); ctx.lineTo(...P(0.42, 0.13)); ctx.moveTo(...P(0.655, 0.29)); ctx.lineTo(...P(0.67, 0.13)); ctx.stroke();
  ctx.fillStyle = '#fff3d6'; ctx.fillRect(0.965 * L, -0.235 * L, 0.03 * L, 0.03 * L);

  if (o.wing) {

    ctx.strokeStyle = '#4b505b'; ctx.lineWidth = Math.max(1.2, wr * 0.14);

function looks(eq, color, tune) {

}

/* ---------- garaje ---------- */
function dibujaFoto() {
  const c = $('foto'), ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  const wall = ctx.createLinearGradient(0, 0, 0, h * 0.72);
  wall.addColorStop(0, '#171a24'); wall.addColorStop(1, '#232838');
  ctx.fillStyle = wall; ctx.fillRect(0, 0, w, h * 0.72);
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 2;
  for (let y = 18; y < h * 0.72; y += 18) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  const floor = ctx.createLinearGradient(0, h * 0.72, 0, h);
  floor.addColorStop(0, '#2a2e3a'); floor.addColorStop(1, '#11131a');
  ctx.fillStyle = floor; ctx.fillRect(0, h * 0.72, w, h * 0.28);
  const g = ctx.createRadialGradient(w / 2, h * 0.05, 10, w / 2, h * 0.6, w * 0.55);
  g.addColorStop(0, 'rgba(255,178,62,.38)'); g.addColorStop(1, 'rgba(255,178,62,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#ffb23e'; ctx.fillRect(w / 2 - 50, 0, 100, 6);
  const s = yo().spec;
  ctx.font = '700 20px "JetBrains Mono", monospace'; ctx.fillStyle = 'rgba(236,230,217,.55)';
  ctx.textAlign = 'left'; ctx.fillText('BOX 01', 24, 38);
  ctx.textAlign = 'right'; ctx.fillText(`${s.peakHp} CV · ${s.peakNm} Nm`, w - 24, 38);
  const L = w * 0.7;
  drawCar(ctx, w / 2 + L / 2, h * 0.88, L, Object.assign(looks(S.eq, COLORES[S.color], S.tune), { wheel: 0.3 }));
}

let slotSel = 'motor', vistaG = 'piezas';

function efecto(delta) {
  if (Math.abs(delta) < 0.005) return '<span class="efecto igual">±0,00 s</span>';
  return delta < 0 ? `<span class="efecto mejor">−${fN(-delta, 2)} s</span>` : `<span class="efecto peor">+${fN(delta, 2)} s</span>`;
}
function specLinea(slot, lv) {
  switch (slot) {
    case 'motor': return `+${lv.hp} CV base · corte ${fN(lv.red)} rpm${lv.knock ? ' · +' + lv.knock + ' margen' : ''}`;
    case 'turbo': return lv.bar ? `${fN(lv.bar, 1)} bar nominal · máx. ${fN(lv.max, 1)} bar` : 'Sin presión';
    case 'ecu': return [lv.flash ? 'Mapa ajustable' : 'Mapa fijo', lv.lc ? 'launch control' : null, lv.flat ? 'flat-shift' : null, lv.pw ? '+' + Math.round(lv.pw * 100) + ' % potencia' : null].filter(Boolean).join(' · ');
    case 'fuel': return `Margen antidetonante ${fN(lv.oct, 1)}${lv.pw ? ' · +' + Math.round(lv.pw * 100) + ' % potencia' : ''}`;
    case 'ruedas': return `μ ${fN(lv.mu, 2)} · ${lv.psi[0]}–${lv.psi[1]} psi`;
    case 'susp': return `Carga en eje trasero al salir: ${Math.round(lv.wt * 100)} %`;
    case 'caja': return `${lv.g.length} marchas · cambio en ${fN(lv.shift, 2)} s`;
    case 'peso': return lv.w ? `${fN(lv.w)} kg` : '1.250 kg';
    case 'nitro': return lv.nos ? `+${Math.round(lv.nos * 100)} % · ${fN(lv.dur, 1)} s` : 'Sin sistema';

}
function pintarOpts() {
  const o = $('opts'); o.innerHTML = '';

  PARTS[slotSel].levels.forEach((lv, i) => {
    const eq2 = Object.assign({}, S.eq, { [slotSel]: i });

    if (slotSel === 'turbo') tune2 = Object.assign({}, S.tune, { bar: lv.bar || null });
    if (slotSel === 'caja') tune2 = Object.assign({}, S.tune, { ratios: [] });
    if (slotSel === 'ruedas') tune2 = Object.assign({}, S.tune, { psi: 0 });

function montar(slot, i) {
  S.eq[slot] = i;
  if (slot === 'turbo') S.tune.bar = PARTS.turbo.levels[i].bar || null;
  if (slot === 'caja') S.tune.ratios = [];
  if (slot === 'ruedas') S.tune.psi = 0;
}
$('opts').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.buy != null) {
    const i = +b.dataset.buy, lv = PARTS[slotSel].levels[i];
    if (S.money < lv.cost) return;

    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${titulo}">
    ${izq ? `<div class="extremos"><span>${izq}</span><span>${der}</span></div>` : ''}</div>`;
}

  let filas = `<tr><td>R/T</td><td>${R.redLight ? 'ROJA' : f3(rtP)}</td><td>${f3(rtR)}</td></tr>`;
  SPLITS.forEach((sp, k) => {
    filas += `<tr><td>${sp.n}</td>${celdas(p.sp[k], r.sp[k])}</tr>`;
    if (sp.spd) filas += `<tr><td>km/h</td><td>${p.spd[k] != null ? kmh(p.spd[k]) : '—'}</td><td>${r.spd[k] != null ? kmh(r.spd[k]) : '—'}</td></tr>`;
  });
  const margen = isFinite(totP) && isFinite(totR) ? Math.abs(totP - totR) : null;
  const res = $('res');
  res.innerHTML = `<div class="tarjeta" role="dialog" aria-label="Resultado">
    <h2 class="${gana ? 'gana' : 'pierde'}">${R.redLight ? 'Luz roja' : gana ? 'Ganas' : 'Pierdes'}</h2>
    <p class="sub">${margen != null ? `${gana ? 'Llegas' : 'Llega'} ${fN(margen, 3)} s antes · ronda ${i + 1} contra ${riv.n}` : `Ronda ${i + 1} · ${riv.n}`}</p>
    <div class="ticket"><header><span>QUEMARUEDA · R${i + 1}</span><span>1/4 MILLA</span></header>
      <table><thead><tr><th></th><th>TÚ</th><th>${riv.s.toUpperCase()}</th></tr></thead><tbody>${filas}</tbody></table>
      <div class="pie"><span>R/T + ET</span><span>${isFinite(totP) ? f3(totP) : '—'} / ${isFinite(totR) ? f3(totR) : '—'}</span></div></div>
    <canvas class="tele" id="tele" width="800" height="400" aria-label="Velocidad frente a tiempo"></canvas>
    <div class="premio-big"><span>${gana ? (primera ? 'Premio' : 'Premio (revancha)') : 'Por participar'}</span><b id="rPremio">+${fE(premio)}</b></div>
    ${tip ? `<p class="consejo">${tip}</p>` : ''}
    <div class="botones">
      <button class="btn grande anuncio ancho" id="rAd">Ver anuncio: ×2 premio</button>
      <button class="btn grande sec" id="rOtra">Repetir</button>
      <button class="btn grande pri" id="rGar">Al garaje</button>
    </div></div>`;
  res.hidden = false; res.scrollTop = 0;
  dibujaTele($('tele'), R.tr, riv.col === '#111111' ? '#8b90a0' : riv.col);
  $('rOtra').onclick = () => { audioOff(); empezar(i); };
  $('rGar').onclick = () => { salir(); vista('g'); subvista('piezas'); };
  $('rAd').onclick = () => {
    const ad = document.createElement('div'); ad.className = 'ad';
    ad.innerHTML = '<span>Anuncio</span><b>3</b><small>Aquí irá el anuncio real cuando el juego esté en la App Store.</small>';
    document.body.appendChild(ad); let n = 3;
    const t = setInterval(() => { n--; if (n > 0) ad.querySelector('b').textContent = n; else { clearInterval(t); ad.remove(); S.money += premio; guardar(); pintarPasta(true); $('rPremio').textContent = '+' + fE(premio * 2); const b = $('rAd'); b.disabled = true; b.textContent = 'Premio duplicado'; } }, 1000);
  };
}

/* ---------- arranque ---------- */
refrescar();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dibujaFoto(); if (vistaG === 'banco') pintarBanco(); });
})();
</script>
